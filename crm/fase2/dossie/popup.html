<!doctype html>
<meta charset="utf-8">
<style>
  body{width:300px;margin:0;padding:16px;font:14px system-ui;color:#25272B}
  h1{font-size:15px;margin:0 0 10px}
  p{color:#5B6069;line-height:1.45;font-size:13px;margin:8px 0}
  button{width:100%;padding:11px;border:none;border-radius:9px;background:#2B5FC7;color:#fff;font:600 14px system-ui;cursor:pointer}
  button:disabled{background:#AEB4BE;cursor:default}
  a{color:#2B5FC7;font-size:12px}
  .erro{color:#B3261E}
  .meio{white-space:pre-line;font-size:12px}

<p id="onde">…</p>

<button id="abrir" style="margin-top:8px;background:#5B6069">🗂 Abrir todos os portais (para você entrar)</button>
<button id="tudo" style="margin-top:8px;background:#1E6F50">🔁 Rodar todos os portais</button>
<p id="rodada" class="meio"></p>
<div style="margin-top:10px;padding-top:10px;border-top:1px solid #E6E8EC">
  <input id="cpf-transp" placeholder="CPF ou NIS (só números)" inputmode="numeric" maxlength="11"
    style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #D9DCE1;border-radius:8px;font:14px system-ui">
  <button id="transp" style="margin-top:6px;background:#5B6069">🔎 Portal da Transparência (sem login)</button>
  <p id="transp-res" class="meio"></p>

<p id="crm"></p>
