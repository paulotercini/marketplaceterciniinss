<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Tercini</title>
<style>
  :root{
    /* proposta visual aprovada: neutros CINZA, um azul só para o "sistema" */
    --azul:#2B5FC7; --azul-escuro:#234E9E; --fundo:#E8EAEE; --lateral:#23262E;
    --texto:#25272B; --cinza:#5B6069; --borda:#D9DCE1; --branco:#fff;
    --verde:#1E6F50; --laranja:#B4530A; --vermelho:#B3261E; --roxo:#5C2E91;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  body{background:var(--fundo);color:var(--texto);height:100vh;overflow:hidden;font-size:14px}
  button{font-family:inherit}

  /* login */
  .login{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fundo)}
  .login form{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:30px;width:340px;display:flex;flex-direction:column;gap:10px}
  .login h1{font-size:18px;color:var(--azul-escuro)}
  .login input{padding:10px;border:1px solid var(--borda);border-radius:8px;font-size:14px}
  .login button{padding:10px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-weight:600;cursor:pointer}
  .login .erro{color:var(--vermelho);font-size:13px;min-height:18px}

  .app{display:none;grid-template-columns:300px 1fr;height:100vh;transition:grid-template-columns .15s}
  .app.mini-lateral{grid-template-columns:58px 1fr}
  .app.logado{display:grid}
  /* ficha aberta = modo 4 colunas: o menu recolhe sozinho para ícones */
  .app.detalhe-aberto{grid-template-columns:58px minmax(290px,28%) minmax(540px,1fr)}

  .sidebar{background:var(--lateral);border-right:1px solid var(--lateral);overflow-y:auto;overflow-x:hidden;padding:12px 0;color:#E8EAED}
  #btn-lateral{display:block;margin:0 12px 8px;border:none;background:none;font-size:17px;cursor:pointer;color:#9AA0B0}
  /* menu recolhido (manual ou automático com a ficha aberta): só os ícones */
  .app.mini-lateral .sidebar .txt, .app.detalhe-aberto .sidebar .txt,
  .app.mini-lateral .sidebar .grupo h3, .app.detalhe-aberto .sidebar .grupo h3,
  .app.mini-lateral .sidebar .cont, .app.detalhe-aberto .sidebar .cont,
  .app.mini-lateral .sidebar .priv, .app.detalhe-aberto .sidebar .priv,
  .app.mini-lateral .sidebar .busca, .app.detalhe-aberto .sidebar .busca,
  .app.mini-lateral .sidebar .usuario>div, .app.detalhe-aberto .sidebar .usuario>div,
  .app.mini-lateral .sidebar .sair, .app.detalhe-aberto .sidebar .sair,
  .app.mini-lateral .sidebar #btn-som, .app.detalhe-aberto .sidebar #btn-som{display:none}
  .app.mini-lateral .sidebar .lista-item, .app.detalhe-aberto .sidebar .lista-item{justify-content:center;padding:8px 0}
  .app.mini-lateral .sidebar .novo-cli, .app.detalhe-aberto .sidebar .novo-cli{width:34px;margin:0 auto 10px;padding:7px 0}
  .app.mini-lateral .sidebar .usuario, .app.detalhe-aberto .sidebar .usuario{justify-content:center}
  /* coluna de casos dentro da ficha (3ª coluna): escolhe o caso, a 4ª mostra o andamento dele */
  /* menu do caso em grafite claro — lê-se como MENU, não como fundo */
  .col-casos{width:186px;flex:none;border-right:1px solid #262A33;background:#313641;overflow-y:auto;padding:10px 8px}
  .col-casos .cc-tit{font-size:11px;font-weight:700;color:#A8AEBB;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px 7px}
  .cc-item{border:1px solid var(--borda);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;background:var(--branco)}
  .cc-item:hover{box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .cc-item.sel{outline:2px solid var(--azul)}
  .cc-item.enc{opacity:.55}
  .cc-item .cc-ben{font-weight:700;font-size:12.5px;line-height:1.25}
  .cc-item .cc-fase{color:var(--cinza);font-size:11px;margin-top:2px}
  .cc-item.novo{border:1px dashed rgba(255,255,255,.4);color:#9FC0F5;background:none}
  .cc-item.novo .cc-ben{color:#9FC0F5}
  .cc-item.sel{outline-color:#9FC0F5}
  .cc-equipe{display:flex;flex-wrap:wrap;gap:5px;padding:2px 6px}
  .mini-eq{cursor:pointer;opacity:.3;filter:grayscale(.6)}
  .mini-eq.on{opacity:1;filter:none}
  .det-principal{flex:1;display:flex;flex-direction:column;min-width:0}
  /* cabeçalho do caso destacado dos andamentos logo abaixo */
  .caso.caso-cab{background:#eef4fb;border-color:#cfe0f5}
  /* janela de encerramento (resultado -> honorários) */
  #janela{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:98;display:flex;align-items:center;justify-content:center}
  .jan-caixa{background:var(--branco);border-radius:12px;padding:20px 24px;min-width:380px;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .jan-caixa h3{margin-bottom:4px}
  .btn-res{padding:8px 14px;border:1px solid var(--borda);border-radius:8px;background:var(--fundo);cursor:pointer;font-weight:600}
  .btn-res:hover{background:#e8f1fb}
  .usuario{display:flex;align-items:center;gap:10px;padding:2px 16px 10px}
  .usuario .sair{margin-left:auto;border:none;background:none;color:#9AA0B0;cursor:pointer;font-size:12px}
  .sidebar .usuario div div{color:#9AA0B0!important}
  .busca{margin:0 12px 14px;position:relative}
  .busca input{width:100%;padding:8px 10px 8px 32px;border:1px solid rgba(255,255,255,.18);border-radius:6px;font-size:14px;background:rgba(255,255,255,.10);color:#E8EAED}
  .busca input::placeholder{color:#9AA0B0}
  .novo-cli{display:block;margin:0 12px 10px;width:calc(100% - 24px);padding:9px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .novo-cli:hover{background:var(--azul-escuro)}
  .sug{border:1px solid var(--borda);border-left:4px solid #8a5cf6;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--branco)}
  .sug .cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .sug .texto{white-space:pre-wrap;font-size:13px;margin:6px 0 10px}
  .sug .acoes{display:flex;gap:8px}
  .sug .acoes button{border:none;border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer}
  .sug .aceitar{background:var(--verde);color:#fff}
  .sug .descartar{background:var(--fundo);color:var(--cinza)}
  .modelo{border:1px solid var(--borda);border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .modelo .cab{display:flex;gap:8px;align-items:center}
  .modelo .cab strong{flex:1}
  .modelo .previa{font-size:13px;color:var(--cinza);margin-top:6px;white-space:pre-wrap}
  .btn-mini{border:1px solid var(--borda);background:var(--branco);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--azul);white-space:nowrap}
  .exig{background:#fbeaea;border:1px solid #e8b4b8;border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .exig strong{color:var(--vermelho)}
  .chip.exig-chip{background:#fbeaea;color:var(--vermelho)}
  .busca::before{content:"🔍";position:absolute;left:9px;top:7px;font-size:13px;opacity:.6}
  .grupo h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9AA0B0;padding:8px 16px 4px}
  .lista-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent;color:#E8EAED}
  .lista-item:hover{background:rgba(255,255,255,.07)}
  .lista-item.ativa{background:rgba(255,255,255,.13);border-left-color:#fff;font-weight:600}
  .lista-item .rotulo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lista-item .cont{margin-left:auto;font-size:12px;color:#CFD3DA;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px}
  .lista-item .priv{margin-left:auto;font-size:10px;color:#D8C6EE;background:rgba(255,255,255,.12);border-radius:8px;padding:1px 6px}
  .sep{border-top:1px solid rgba(255,255,255,.12);margin:8px 12px}
  .avatar{width:28px;height:28px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;background:var(--azul)}
  .avatar.mini{width:22px;height:22px;font-size:10px}

  .meio{overflow-y:auto;padding:18px 22px}
  .meio-topo{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
  .meio-topo h1{font-size:21px;color:var(--azul-escuro)}
  .ordenar{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--cinza);font-size:13px;flex-wrap:wrap}
  .ordenar select{padding:5px 8px;border:1px solid var(--borda);border-radius:6px;background:var(--branco);font-size:13px}
  .meio-sub{color:var(--cinza);font-size:13px;margin-bottom:12px}
  .filtros{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .fchip{border:1px solid var(--borda);background:var(--branco);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
  .fchip.on{background:var(--azul);border-color:var(--azul);color:#fff}
  h3.secao{font-size:13px;color:var(--cinza);margin:12px 0 6px}
  /* meio-termo: cartão com respiro interno, só a distância entre eles é menor */
  .cartao{background:var(--branco);border:1px solid var(--borda);border-radius:8px;padding:8px 14px;margin-bottom:5px;cursor:pointer;display:flex;align-items:center;gap:11px;box-shadow:0 1px 2px rgba(30,32,36,.05)}
  .cartao:hover{box-shadow:0 3px 10px rgba(30,32,36,.10)}
  .cartao.sel{outline:2px solid var(--azul)}
  .cartao.feita{opacity:.55}
  .cartao.feita .nome{text-decoration:line-through}
  .cartao .check{width:16px;height:16px;border:2px solid var(--cinza);border-radius:50%;flex:none;cursor:pointer}
  .cartao.feita .check{background:var(--verde);border-color:var(--verde)}
  .cartao .info{min-width:0;flex:1}
  .cartao .nome{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cartao .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px;color:var(--cinza);align-items:center}
  .chip{border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
  .chip.ben{background:#e8f1fb;color:var(--azul-escuro)}
  /* datas como no To Do: vencida vermelha, hoje azul, futura preta — sem fundo */
  .chip.prazo{background:none;padding:0;border-radius:0;color:#3b3a39}
  .chip.prazo.venc{color:var(--vermelho);font-weight:700}
  .chip.prazo.hoje{color:var(--azul);font-weight:700}
  .chip.prazo.ok{color:#3b3a39}
  .chip.fase{background:#eef7ee;color:var(--verde)}
  .chip.per{background:#efe6f7;color:var(--roxo)}
  .chip.neutro{background:var(--fundo);color:var(--cinza);font-weight:400}
  .avatares{display:flex;flex:none}
  .avatares .avatar{margin-left:-6px;border:2px solid var(--branco)}
  .acao-card{border:none;background:none;font-size:15px;cursor:pointer;color:#c8c6c4;flex:none}
  .acao-card.on{color:#eaa300}
  /* emojis não obedecem a cor do CSS — apagado = cinza via grayscale */
  .acao-card.sol,.acao-card.fogo{filter:grayscale(1);opacity:.35}
  .acao-card.sol.on,.acao-card.fogo.on{filter:none;opacity:1}
  .chip.urg{background:#fbeaea;color:var(--vermelho)}
  .nova{display:flex;gap:8px;align-items:center;background:var(--branco);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;margin-bottom:12px}
  .nova input{flex:1;border:none;outline:none;font-size:14px}
  .nova input[type=date]{flex:none;color:var(--cinza)}
  .nova button{border:none;background:var(--azul);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}

  .detalhe{display:none;background:var(--branco);border-left:1px solid var(--borda);overflow-y:auto}
  .app.detalhe-aberto .detalhe{display:flex;flex-direction:row}
  .det-rolagem{flex:1;overflow-y:auto}
  .det-topo{position:sticky;top:0;background:var(--branco);border-bottom:1px solid var(--borda);padding:14px 22px;z-index:2}
  .det-topo .linha1{display:flex;align-items:center;gap:10px}
  .det-topo h2{font-size:18px}
  .fechar{margin-left:auto;border:none;background:none;font-size:20px;cursor:pointer;color:var(--cinza)}
  .det-topo .resumo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .abas{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .aba{padding:7px 13px;border:1px solid var(--borda);background:var(--fundo);cursor:pointer;font-size:13px;color:var(--texto);border-radius:16px;font-weight:600}
  .aba:hover{background:#e3eefa}
  .aba.ativa{background:var(--azul);border-color:var(--azul);color:#fff}
  .painel{display:none;padding:16px 22px 20px}
  .painel.ativo{display:block}
  .campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .campo{background:var(--fundo);border:1px solid var(--borda);border-radius:8px;padding:8px 12px}
  .campo label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza);margin-bottom:2px}
  .campo .valor{font-weight:600;word-break:break-word;display:flex;gap:8px;align-items:center}
  .campo .valor a{color:var(--azul);text-decoration:none}
  .olho{border:none;background:none;cursor:pointer;font-size:13px}
  .caso{border:1px solid var(--borda);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--branco)}
  .caso .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .caso .rotulo-caso{font-size:11px;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em}
  .caso .titulo-caso{font-size:15px;font-weight:700}
  .fases-trilha{display:flex;margin:10px 0 4px;font-size:11px;flex-wrap:wrap}
  .fase-et{padding:4px 12px;background:var(--fundo);border:1px solid var(--borda);color:var(--cinza);white-space:nowrap;font:inherit;font-size:13px;cursor:pointer}
  .fase-et:not(.atual):hover{background:#e3eefa;color:var(--azul)}
  .fase-et.atual{cursor:default}
  .fase-et:first-child{border-radius:6px 0 0 6px}
  .fase-et:last-child{border-radius:0 6px 6px 0}
  .fase-et.feita{background:#eef7ee;color:var(--verde)}
  .fase-et.atual{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:700}
  .lembrar-caixa{display:inline-flex;align-items:center;gap:6px;background:#fdf3e7;border:1px solid #f0d9b8;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--laranja)}
  .lembrar-caixa input{border:none;background:none;font:inherit;color:inherit}
  .ult-and{font-size:12px;color:var(--cinza);margin-top:8px}
  .caso select,.caso input[type=date]{padding:3px 6px;border:1px solid var(--borda);border-radius:6px;font-size:12px;background:var(--branco)}
  .timeline{list-style:none}
  .timeline li{display:flex;gap:12px;padding:10px 12px;border-radius:8px;margin-bottom:4px;border-left:4px solid transparent}
  .timeline li:nth-child(odd){background:var(--fundo)}   /* reserva, se a cor do autor não carregar */
  .timeline .quando{flex:none;width:130px;font-size:12px;color:var(--cinza);display:flex;gap:8px}
  .timeline .texto{flex:1;white-space:pre-wrap}
  /* painel de registro: bem destacado — é aqui que se comenta */
  .escrever{border-top:3px solid var(--azul);padding:12px 22px 14px;background:#D9E5F8}
  .escrever input#and-texto{background:var(--branco)}
  .equipe-chip.av.on{background:#E8F1FB;border-color:var(--azul);font-weight:700}
  /* atribuição + lembrete no topo do processo, destacados */
  .caso-acoes{background:#FFF4D6;border:1px solid #E9B44C;border-radius:10px;padding:10px 14px;margin-bottom:10px}
  /* checklist em quadrado próprio */
  .caso.caso-check{background:#EDF6EE;border-color:#CBE3CE}
  .escrever .dica{font-size:12px;color:var(--verde);margin-bottom:6px}
  .escrever .linha{display:flex;gap:8px;align-items:center}
  .acao-rapida{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .acao-rapida .rotulo-rap{font-size:11px;color:var(--cinza);font-weight:700;letter-spacing:.05em}
  /* ⭐/🔥 bem visíveis mesmo desligados: contorno colorido; ligado = preenchido ✓ */
  .btn-rap{border:2px solid;background:var(--branco);border-radius:999px;
    padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-rap.imp{border-color:#E9B44C;color:#8A6D00}
  .btn-rap.imp.on{background:#FFC83D;border-color:#D9A400;color:#4A3B00}
  .btn-rap.urg{border-color:#E39A9A;color:var(--vermelho)}
  .btn-rap.urg.on{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  /* menu do caso: barra escura horizontal no topo da ficha */
  .menu-topo{background:#313641;border-radius:10px;padding:5px;display:flex;gap:3px;
    flex-wrap:wrap;align-items:center;margin-top:10px}
  .mt{background:transparent;color:#C9CED8;border:none;border-radius:8px;
    padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
  .mt:hover{background:rgba(255,255,255,.1)}
  .mt.on{background:#fff;color:var(--texto)}
  .mt.mt-proc{max-width:320px;overflow:hidden;text-overflow:ellipsis}
  #menu-processos{position:fixed;z-index:99;background:var(--branco);border:1px solid var(--borda);
    border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:6px;min-width:290px;max-height:65vh;overflow-y:auto}
  #menu-processos .mp-it{padding:8px 10px;border-radius:8px;cursor:pointer}
  #menu-processos .mp-it:hover{background:var(--fundo)}
  #menu-processos .mp-it.sel{outline:2px solid var(--azul);outline-offset:-2px}
  #menu-processos .mp-it b{font-size:13.5px}
  #menu-processos .mp-it small{display:block;color:var(--cinza);font-size:11.5px;margin-top:1px}
  #menu-processos .mp-novo{color:var(--azul);border:1px dashed var(--borda);text-align:center;font-weight:700}
  /* apagar o próprio comentário */
  .timeline li{position:relative}
  .apaga{position:absolute;top:6px;right:8px;border:none;background:none;cursor:pointer;
    color:var(--cinza);font-size:13px;opacity:.4}
  .apaga:hover{opacity:1;color:var(--vermelho)}
  .escrever .equipe-chip{background:var(--branco)}
  .escrever select{max-width:220px;padding:8px;border:1px solid var(--borda);border-radius:8px;font-size:13px}
  .escrever input{flex:1;padding:10px 12px;border:1px solid var(--borda);border-radius:8px;font-size:14px}
  .escrever button{padding:9px 18px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-weight:600;cursor:pointer}
  .evento{border:1px solid var(--borda);border-left:4px solid var(--roxo);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .evento .data-box{flex:none;text-align:center;background:#efe6f7;color:var(--roxo);border-radius:8px;padding:5px 12px;font-weight:700}
  .evento .data-box small{display:block;font-weight:400;font-size:11px}
  .evento .oque{flex:1;min-width:180px}
  .evento .oque strong{display:block}
  .evento .oque span{color:var(--cinza);font-size:13px}
  /* realizada = cinza e riscada; futura = viva, na cor roxa */
  .evento.passado{border-left-color:#c8c6c4;opacity:.6;background:#faf9f8}
  .evento.passado .oque strong,.evento.passado .oque span{text-decoration:line-through;color:var(--cinza)}
  .evento.passado .data-box{background:#f0efee;color:var(--cinza);text-decoration:line-through}
  .evento.futuro .data-box{background:var(--roxo);color:#fff}
  .evento.futuro .oque strong{color:var(--roxo)}
  .form-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .form-linha input,.form-linha select{padding:8px;border:1px solid var(--borda);border-radius:8px;font-size:13px}
  .form-linha button{padding:8px 14px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-weight:600;cursor:pointer}
  /* menu "Mover para…" (botão direito no cartão, como no To Do) */

<body>

<script>
// ── CONFIGURAÇÃO (preencher na instalação — ver COMO-INSTALAR.md) ─────────
const CONFIG = {
  SUPABASE_URL: "COLE_AQUI_https://xxxx.supabase.co",
  ANON_KEY: "COLE_AQUI_a_anon_key",
};
// ──────────────────────────────────────────────────────────────────────────

const hoje = () => new Date().toLocaleDateString("sv", {timeZone: "America/Sao_Paulo"});
const fmt = iso => iso ? iso.slice(8,10)+"."+iso.slice(5,7)+"."+iso.slice(0,4) : "";
const fmtCpf = c => c ? c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : "—";
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dsa = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const moeda = v => v==null ? "—" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

let sessao = null;   // {access_token, refresh_token, user}
let eu = null;       // linha de colaboradores do usuário logado
let D = {};          // dados carregados: colaboradores, clientes, casos, ...
let visao = "meudia", filtroColab = null, filtroVencidas = false, buscaTxt = "", clienteAberto = null, abaAtiva = 2, casoSel = null;
let avisarSel = new Set();   // quem deve ser avisado no próximo comentário (obrigatório)

// som de retorno, como no To Do (gerado na hora — sem arquivo de áudio).
// "plim" duplo ao concluir; tique curto nos avisos. 🔔 na lateral silencia.
function somLigado(){ return localStorage.getItem("crm_som")!=="off"; }
function plim(tipo){
  if(!somLigado()) return;
  try{
    const ctx = plim.ctx || (plim.ctx = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==="suspended") ctx.resume();
    const t0=ctx.currentTime;
    const notas = tipo==="suave" ? [[740,0,.09,.10]] : [[587,0,.12,.16],[880,.10,.20,.18]];
    notas.forEach(([f,dt,dur,vol])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+dt);
      g.gain.exponentialRampToValueAtTime(vol,t0+dt+.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+dur);
      o.connect(g).connect(ctx.destination); o.start(t0+dt); o.stop(t0+dt+dur+.05);
    });
  }catch(e){}
}
function aviso(msg, som=true){
  const el = document.getElementById("aviso");
  el.textContent = msg; el.classList.add("on");
  setTimeout(()=>el.classList.remove("on"), 2600);
  if(som) plim("suave");
}

// ── API (PostgREST + GoTrue por fetch, com paginação e refresh) ───────────
async function api(caminho, opcoes={}, tentativa=0){
  const r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"") + caminho, {
    ...opcoes,
    headers: {
      apikey: CONFIG.ANON_KEY,
      Authorization: "Bearer " + (sessao ? sessao.access_token : CONFIG.ANON_KEY),
      "Content-Type": "application/json",
      ...(opcoes.headers||{}),
    },
  });
  if(r.status === 401 && sessao && tentativa === 0){
    const ok = await renovar();
    if(ok) return api(caminho, opcoes, 1);
    return sair();
  }
  if(!r.ok){
    const corpo = await r.text();
    const e = new Error(`${r.status}: ${corpo.slice(0,200)}`);
    e.status = r.status;
    throw e;
  }
  const texto = await r.text();
  return texto ? JSON.parse(texto) : null;
}

async function todas(tabela, filtro=""){  // paginação (Supabase limita a 1000)
  const out = [];
  for(let de=0;;de+=1000){
    const pg = await api(`/rest/v1/${tabela}?${filtro}`, {
      headers: {Range: `${de}-${de+999}`, "Range-Unit": "items"},
    });
    out.push(...pg);
    if(pg.length < 1000) return out;
  }
}

async function renovar(){
  try{
    const r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"") + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{apikey:CONFIG.ANON_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({refresh_token: sessao.refresh_token}),
    });
    if(!r.ok) return false;
    sessao = await r.json();
    localStorage.setItem("crm_sessao", JSON.stringify(sessao));
    return true;
  }catch{ return false; }
}

// ── login ─────────────────────────────────────────────────────────────────
async function entrar(ev){
  ev.preventDefault();
  const erro = document.getElementById("login-erro");
  erro.textContent = "";
  try{
    const r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"") + "/auth/v1/token?grant_type=password", {
      method:"POST", headers:{apikey:CONFIG.ANON_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({email: document.getElementById("login-email").value,
                            password: document.getElementById("login-senha").value}),
    });
    const corpo = await r.json();
    if(!r.ok) throw new Error(corpo.error_description || corpo.msg || "falha no login");
    sessao = corpo;
    localStorage.setItem("crm_sessao", JSON.stringify(sessao));
    await iniciar();
  }catch(e){ erro.textContent = e.message; }
}

function sair(){
  localStorage.removeItem("crm_sessao");
  location.reload();
}

async function iniciar(){
  const meus = await api(`/rest/v1/colaboradores?auth_id=eq.${sessao.user.id}&select=*`);
  if(!meus.length){
    document.getElementById("login-erro").textContent =
      "Usuário sem colaborador vinculado — veja o passo 'vincular usuários' no COMO-INSTALAR.md";
    sessao = null; localStorage.removeItem("crm_sessao");
    return;
  }
  eu = meus[0];
  document.getElementById("tela-login").style.display = "none";
  const app = document.getElementById("app");
  app.classList.add("logado");
  if(localStorage.getItem("crm_menu")==="mini") app.classList.add("mini-lateral");
  document.getElementById("u-nome").textContent = eu.nome;
  const uav = document.getElementById("u-avatar");
  uav.textContent = eu.inicial; uav.style.background = eu.cor;
  await carregar();
  // Meu Dia abre filtrado em você só se você tiver casos atribuídos;
  // sem atribuições ainda, abre em "Todos" — senão a aba parece vazia/quebrada
  filtroColab = [...D.atrDoCaso.values()].some(v=>v.includes(eu.id)) ? eu.id : null;
  montarSidebar();
  render();
}

async function carregar(){
  const d30 = new Date(); d30.setDate(d30.getDate()-30);
  const [colaboradores, clientes, casos, atribuicoes, tarefas, eventos, pagamentos, meudia, and30, modelos, sugestoes, mencoes, leads, docs, ckls, docModelos, frases, lembrarMotivos] =
    await Promise.all([
      todas("colaboradores","select=*&order=nome"),
      todas("clientes","select=*&order=nome"),
      todas("casos","select=*"),
      todas("atribuicoes","select=*"),
      todas("tarefas","select=*"),
      todas("eventos","select=*&order=data_hora"),
      todas("pagamentos","select=*"),
      todas("meu_dia",`select=*&dia=eq.${hoje()}`),
      todas("andamentos",`select=autor_id,criado_em,caso_id&criado_em=gte.${d30.toISOString()}`),
      todas("modelos_mensagem","select=*&order=titulo"),
      todas("sugestoes","select=*&status=eq.pendente&order=criado_em.desc"),
      todas("mencoes",`select=*&para_id=eq.${eu.id}&lida_em=is.null&order=criado_em.desc`),
      todas("leads","select=*&order=criado_em.desc"),
      todas("documentos_beneficio","select=*"),
      todas("checklist_modelo","select=*"),
      todas("modelos_documento","select=*&order=titulo"),
      todas("frases_prontas","select=*&order=texto").catch(()=>[]),
      todas("lembrar_motivos","select=*&order=ordem").catch(()=>[]),
    ]);
  D = {colaboradores, clientes, casos, atribuicoes, tarefas, eventos, pagamentos, meudia, and30, modelos, sugestoes, mencoes, leads, docs, ckls, docModelos, frases, lembrarMotivos};
  D.cliPorId = new Map(clientes.map(c=>[c.id,c]));
  D.casoPorId = new Map(casos.map(c=>[c.id,c]));
  D.colPorId = new Map(colaboradores.map(c=>[c.id,c]));
  D.casosDoCliente = new Map();
  casos.forEach(k=>{ if(!D.casosDoCliente.has(k.cliente_id)) D.casosDoCliente.set(k.cliente_id,[]);
                     D.casosDoCliente.get(k.cliente_id).push(k); });
  D.atrDoCaso = new Map();
  atribuicoes.forEach(a=>{ if(!D.atrDoCaso.has(a.caso_id)) D.atrDoCaso.set(a.caso_id,[]);
                           D.atrDoCaso.get(a.caso_id).push(a.colaborador_id); });
  // índice de pesquisa por cliente
  clientes.forEach(c=>{
    const ks = D.casosDoCliente.get(c.id)||[];
    c._ix = dsa([c.nome,c.cpf,c.telefone,ks.map(k=>k.titulo+" "+(k.processo||"")+" "+(k.nb||"")+" "+(k.beneficio||"")+" "+(k.parceria||"")+" "+((k.protocolos||[]).join(" "))).join(" ")].join(" "));
  });
}

// ── estrutura de navegação ────────────────────────────────────────────────
const FASES = [
  ["prazo","🗓 Tarefas com Prazo"], ["escritorio","🙋 Escritório"], ["inss","🌻 INSS"],
  ["judicial","👪 Judicial"], ["conselho","🖥 Conselho de Recursos"],
  ["peticao_inicial","💡 Petições Iniciais"],
  ["aposentadoria_futura","🙏 Aposentadorias Futuras"],
];
const NOME_FASE = {escritorio:"Escritório", inss:"INSS", conselho:"Conselho", judicial:"Judicial",
  pagamento:"Pagamento", aposentadoria_futura:"Apos. Futura",
  peticao_inicial:"Petições Iniciais", outro:"Outros", encerrado:"Encerrado"};

// cores por lista, como no To Do (fundo suave + título na cor da lista)
const TEMA = {
  "meudia":            ["#5c6bc0", "#eef0fa"],
  "mencoes":           ["#b4530a", "#fdf3e7"],
  "planejado":         ["#1e6f50", "#e9f5ef"],
  "minhas":            ["#00668c", "#e7f4fa"],
  "importante":        ["#d64570", "#fdeef3"],
  "particulares":      ["#5c53c9", "#f0effa"],
  "fase:prazo":        ["#5c53c9", "#eceafb"],
  "fase:escritorio":   ["#b4530a", "#fdf3e7"],
  "fase:inss":         ["#9a7b00", "#fdf9e2"],
  "fase:judicial":     ["#1e4fa3", "#e8f1fb"],
  "fase:conselho":     ["#00668c", "#e7f4fa"],
  "fase:aposentadoria_futura": ["#7a4dd8", "#f2ecfc"],
  "fase:peticao_inicial": ["#B08900", "#FBF6E3"],
  "claude":            ["#7a4dd8", "#f2ecfc"],
  "docmodelos":        ["#4a5568", "#f1f3f5"],
  "quadro":            ["#1e4fa3", "#f3f6fb"],
  "vendas":            ["#1e6f50", "#e9f5ef"],
  "parcerias":         ["#6d4c41", "#f4eeeb"],
  "marketing":         ["#d64570", "#fdeef3"],
  "recebimentos":      ["#1e6f50", "#e9f5ef"],
  "agenda":            ["#5c2e91", "#f1eafa"],
  "dashboard":         ["#1e4fa3", "#f3f6fb"],
  "novocliente":       ["#1e4fa3", "#f3f6fb"],
};
function aplicarTema(){
  // fundo sempre neutro (cinza); a cor da lista fica só no título — a
  // identidade continua, sem sete fundos coloridos disputando a tela
  const [cor] = TEMA[buscaTxt?"dashboard":visao] || ["#234E9E"];
  document.querySelector(".meio").style.background = "var(--fundo)";
  document.getElementById("titulo-lista").style.color = cor;
}

function ativos(){ return D.casos.filter(k=>k.fase!=="encerrado"); }
// chip de prazo estilo semáforo 🚦
function chipPrazo(prazo, motivo){
  if(!prazo) return "";
  const cls = prazo<hoje() ? "venc" : prazo===hoje() ? "hoje" : "ok";
  return `<span class="chip prazo ${cls}"${motivo?` title="${esc(motivo)}"`:""}>🗓 ${prazo===hoje()?"Hoje":fmt(prazo)}</span>`;
}
function diasAte(iso){ return Math.ceil((new Date(iso+"T12:00:00")-new Date(hoje()+"T12:00:00"))/864e5); }
function chipExig(k){
  if(!k.exigencia_prazo) return "";
  const d=diasAte(k.exigencia_prazo);
  return `<span class="chip exig-chip">⚠ exigência · ${d<0?`VENCIDA há ${-d}d`:d===0?"vence HOJE":`faltam ${d}d`}</span>`;
}
// preenche um modelo de mensagem com os dados do cliente/evento
function preencher(texto, cli, ev, prazoExig){
  const map={
    "{nome}": cli?cli.nome:"", "{primeiro_nome}": cli?cli.nome.split(" ")[0]:"",
    "{data}": ev?fmt(ev.data_hora.slice(0,10)):"", "{hora}": ev?ev.data_hora.slice(11,16):"",
    "{local}": ev?(ev.local||"(local a confirmar)"):"", "{prazo}": prazoExig?fmt(prazoExig):"",
  };
  return Object.entries(map).reduce((t,[k,v])=>t.split(k).join(v), texto);
}
function modeloPor(contexto){ return D.modelos.find(m=>m.contexto===contexto); }
// link "criar evento" do Google Agenda (sem precisar de conexão/conta Google no app)
function gcal(titulo, dataIso, horaIni, minutos, detalhes, local){
  const d1=new Date(dataIso+"T"+horaIni+":00");
  const d2=new Date(d1.getTime()+(minutos||60)*60000);
  const g=d=>d.toLocaleDateString("sv").replace(/-/g,"")+"T"+d.toTimeString().slice(0,8).replace(/:/g,"");
  const p=new URLSearchParams({action:"TEMPLATE", text:titulo, dates:g(d1)+"/"+g(d2),
    details:detalhes||"", location:local||"", ctz:"America/Sao_Paulo"});
  return "https://calendar.google.com/calendar/render?"+p;
}
// lista "efetiva" do caso: um mover pedido no app vale na hora,

function listaDe(k){ return k.mover_para || k.origem_lista || "—"; }
function casosDaFase(f){
  // Tarefas com Prazo é a LISTA FIXA do To Do (não "tudo que tem data") —
  // a agenda geral por data fica na visão Planejado.
  if(f==="prazo") return ativos().filter(k=>listaDe(k)==="🗓 Tarefas com Prazo");
  return ativos().filter(k=>k.fase===f);
}
// mover caso de lista, como o "Mover" do botão direito no To Do
const LISTAS_MOVER=[
  ["🗓 Tarefas com Prazo","outro"], ["🙋 Escritório","escritorio"], ["🌻 INSS","inss"],
  ["🖥 Conselho de Recursos","conselho"], ["👪 Judicial","judicial"],
  ["💡 Petições Iniciais","peticao_inicial"],
  ["🙏 Aposentadorias Futuras","aposentadoria_futura"], ["💵 Pagamentos","pagamento"],
];
function fecharMenuMover(){ const m=document.getElementById("menu-mover"); if(m) m.remove(); }
function menuMover(ev, cliId){
  ev.preventDefault(); fecharMenuMover();
  const ks=(D.casosDoCliente.get(cliId)||[]).filter(k=>k.fase!=="encerrado");
  if(!ks.length) return;
  const m=document.createElement("div"); m.id="menu-mover";
  m.innerHTML = `<div class="mm-tit">Mover para…</div>` + ks.map(k=>
    (ks.length>1?`<div class="mm-caso">${esc(tituloCaso(k))}</div>`:"") +
    LISTAS_MOVER.map(([l])=>{
      const atual = listaDe(k)===l;
      return `<div class="mm-it ${atual?"atual":""}" data-mv="${k.id}|${l}">${l}${atual?" ✓":""}</div>`;
    }).join("")).join("");
  document.body.appendChild(m);
  const W=m.offsetWidth||240, H=m.offsetHeight||280;
  m.style.left=Math.min(ev.clientX, innerWidth-W-8)+"px";
  m.style.top =Math.min(ev.clientY, innerHeight-H-8)+"px";
  m.querySelectorAll("[data-mv]").forEach(it=>it.onclick=()=>{
    const [kid,l]=it.dataset.mv.split("|"); moverCaso(kid,l);
  });
  setTimeout(()=>document.addEventListener("click", fecharMenuMover, {once:true}));
}
async function moverCaso(casoId, lista){
  const k=D.casoPorId.get(casoId); if(!k || listaDe(k)===lista) return fecharMenuMover();
  const fase=(LISTAS_MOVER.find(([l])=>l===lista)||[])[1];
  k.mover_para=lista; if(fase) k.fase=fase;
  await api(`/rest/v1/casos?id=eq.${casoId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({mover_para:lista, ...(fase?{fase}:{})})});
  fecharMenuMover();
  aviso(`Movido para ${lista} — o To Do acompanha na próxima sincronização`);
  montarSidebar(); render();
}

function cartaoCliente(cli, casosMostrar){

  const resp = [...new Set(ks.flatMap(k=>D.atrDoCaso.get(k.id)||[]))].map(id=>D.colPorId.get(id)).filter(Boolean);
  const prazoMin = ks.map(k=>k.prazo).filter(Boolean).sort()[0];
  const evFut = D.eventos.find(e=>ks.some(k=>k.id===e.caso_id) && e.status==="agendada" && e.data_hora.slice(0,10)>=hoje());
  const imp = ks.some(k=>k.importante);
  const noMeuDia = D.meudia.some(m=>m.colaborador_id===eu.id && ks.some(k=>k.id===m.caso_id));
  return `<div class="cartao" data-cli="${cli.id}" ${resp.length?`style="border-left:4px solid ${resp[0].cor}"`:""}>
    <span class="check"></span>
    <div class="info">
      <div class="nome">${esc(cli.nome)}</div>
      <div class="meta">
        ${ks.some(k=>k.urgente)?`<span class="chip urg">🔥 URGENTE</span>`:""}
        ${[...new Set(ks.map(k=>NOME_FASE[k.fase]))].map(f=>`<span class="chip fase">${esc(f)}</span>`).join("")}
        ${[...new Set(ks.map(k=>k.beneficio).filter(Boolean))].slice(0,2).map(b=>`<span class="chip ben">${esc(b)}</span>`).join("")}
        ${ks.map(chipExig).join("")}
        ${(kp=>chipPrazo(prazoMin, kp&&kp.lembrar_motivo))(ks.find(x=>x.prazo===prazoMin))}
        ${(kp=>kp&&kp.lembrar_motivo?`<span class="chip neutro" title="${esc(kp.lembrar_motivo)}">📌 ${esc(kp.lembrar_motivo.length>32?kp.lembrar_motivo.slice(0,32)+"…":kp.lembrar_motivo)}</span>`:"")(ks.find(x=>x.prazo===prazoMin))}
        ${evFut?`<span class="chip per">🩺 ${esc(evFut.tipo)} ${fmt(evFut.data_hora.slice(0,10))}</span>`:""}
        ${ks.length>1?`<span class="chip neutro">${ks.length} casos</span>`:""}
      </div>
    </div>
    <div class="avatares" data-equipe="${cli.id}" title="atribuições — clique para editar">${resp.map(c=>`<span class="avatar mini" style="background:${c.cor}" title="${esc(c.nome)}">${esc(c.inicial)}</span>`).join("")||`<span class="avatar mini" style="background:#c8c6c4">＋</span>`}</div>
    <button class="acao-card fogo ${ks.some(k=>k.urgente)?"on":""}" title="Urgente" data-fogo="${ks[0]?ks[0].id:""}">🔥</button>
    <button class="acao-card sol ${noMeuDia?"on":""}" title="Meu Dia" data-sol="${ks[0]?ks[0].id:""}">☀️</button>
    <button class="acao-card ${imp?"on":""}" title="Importante" data-estrela="${ks[0]?ks[0].id:""}">★</button>
  </div>`;
}

function grupoClientes(casosSel){
  const porCli = new Map();
  casosSel.forEach(k=>{ if(!porCli.has(k.cliente_id)) porCli.set(k.cliente_id,[]);
                        porCli.get(k.cliente_id).push(k); });
  let pares = [...porCli].map(([cid,ks])=>[D.cliPorId.get(cid),ks]).filter(p=>p[0]);
  const ord = document.getElementById("ordem").value;
  if(ord==="alfa") pares.sort((a,b)=>a[0].nome.localeCompare(b[0].nome,"pt"));
  else pares.sort((a,b)=>{
    const pa=a[1].map(k=>k.prazo).filter(Boolean).sort()[0]||"9999";
    const pb=b[1].map(k=>k.prazo).filter(Boolean).sort()[0]||"9999";
    return pa<pb?-1:1;
  });
  // 🔥 urgentes sempre no topo, independente da ordenação escolhida
  pares.sort((a,b)=>(b[1].some(k=>k.urgente)?1:0)-(a[1].some(k=>k.urgente)?1:0));
  return pares;
}

function ligarCartoes(){
  document.querySelectorAll(".cartao[data-cli]").forEach(el=>{
    el.onclick=e=>{
      if(e.target.dataset.sol!==undefined || e.target.dataset.estrela!==undefined) return;
      abrirFicha(el.dataset.cli);
    };
    el.oncontextmenu=e=>menuMover(e, el.dataset.cli);   // botão direito = Mover para…
  });
  document.querySelectorAll("[data-sol]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const casoId = b.dataset.sol; if(!casoId) return;
    // liga/desliga: segundo clique retira do Meu Dia
    const ja = D.meudia.find(m=>m.caso_id===casoId && m.colaborador_id===eu.id);
    try{
      if(ja){
        await api(`/rest/v1/meu_dia?id=eq.${ja.id}`,{method:"DELETE"});
        aviso("Retirado do seu Meu Dia");
      }else{
        await api(`/rest/v1/meu_dia`,{method:"POST",body:JSON.stringify(
          {colaborador_id:eu.id, caso_id:casoId, dia:hoje()}),headers:{Prefer:"return=minimal"}});
        aviso("Adicionado ao seu Meu Dia ☀️");
      }
    }catch(err){ aviso("Erro: "+err.message); }
    D.meudia = await todas("meu_dia",`select=*&dia=eq.${hoje()}`);
    render();
  });
  document.querySelectorAll("[data-estrela]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const k = D.casoPorId.get(b.dataset.estrela); if(!k) return;
    k.importante = !k.importante;
    await api(`/rest/v1/casos?id=eq.${k.id}`,{method:"PATCH",body:JSON.stringify({importante:k.importante}),headers:{Prefer:"return=minimal"}});
    montarSidebar(); render();
  });
  document.querySelectorAll("[data-fogo]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const k = D.casoPorId.get(b.dataset.fogo); if(!k) return;
    k.urgente = !k.urgente;
    await api(`/rest/v1/casos?id=eq.${k.id}`,{method:"PATCH",body:JSON.stringify({urgente:k.urgente}),headers:{Prefer:"return=minimal"}});
    aviso(k.urgente?"🔥 Marcado como URGENTE":"Urgência removida"); render();
  });
  document.querySelectorAll(".avatares[data-equipe]").forEach(a=>a.onclick=e=>{
    e.stopPropagation(); abrirFicha(a.dataset.equipe);   // a equipe fica no menu vertical da ficha
  });
}

let filtroPlan="todas", filtroPlanColab=null;   // Planejado abre mostrando tudo, em seções
function renderPlanejado(){
  document.getElementById("titulo-lista").textContent="🗓️ Planejado";
  document.getElementById("sub-lista").textContent=
    "A agenda do escritório — tudo que tem data para lembrar (último dia de prazo, contato com cliente, prorrogação...).";
  const per=[["venc","⚠ Vencidas"],["hoje","Hoje"],["3","Próx. 3 dias"],["7","Próx. 7 dias"],["todas","Todas"]];
  const em = d=>{ const x=new Date(hoje()+"T12:00:00"); x.setDate(x.getDate()+d); return x.toLocaleDateString("sv"); };
  let base = ativos().filter(k=>k.prazo);
  if(filtroPlanColab) base = base.filter(k=>(D.atrDoCaso.get(k.id)||[]).includes(filtroPlanColab));
  if(filtroPlan==="venc") base = base.filter(k=>k.prazo<hoje());
  else if(filtroPlan==="hoje") base = base.filter(k=>k.prazo===hoje());
  else if(filtroPlan==="3") base = base.filter(k=>k.prazo>=hoje() && k.prazo<=em(3));
  else if(filtroPlan==="7") base = base.filter(k=>k.prazo>=hoje() && k.prazo<=em(7));
  const chipsPer = per.map(([v,r])=>`<button class="fchip ${filtroPlan===v?"on":""}" data-per="${v}">${r}</button>`).join("");
  const chipsCol = [`<button class="fchip ${filtroPlanColab===null?"on":""}" data-pcol="">Todos</button>`]
    .concat(D.colaboradores.filter(c=>c.ativo).map(c=>
      `<button class="fchip ${filtroPlanColab===c.id?"on":""}" data-pcol="${c.id}">`+
      `<span class="avatar mini" style="background:${c.cor}">${esc(c.inicial)}</span>${esc(c.nome)}</button>`)).join("");
  base = base.slice().sort((a,b)=>a.prazo<b.prazo?-1:1);
  document.getElementById("ordem").value="prazo";   // agenda em ordem cronológica
  // seções estilo To Do: vencidas → hoje → amanhã → semana → mais tarde
  const secoes=[
    ["🔴 Vencidas",        k=>k.prazo<hoje()],
    ["🟡 Vencem hoje",     k=>k.prazo===hoje()],
    ["🟢 Amanhã",          k=>k.prazo===em(1)],
    ["🗓 Próximos 7 dias", k=>k.prazo>em(1) && k.prazo<=em(7)],
    ["📅 Mais tarde",      k=>k.prazo>em(7)],
  ];
  document.getElementById("conteudo-meio").innerHTML =
    `<div class="filtros">${chipsPer}</div><div class="filtros">${chipsCol}</div>`
    + `<div class="meio-sub">${base.length} data(s) neste filtro</div>`
    + secoes.map(([tit,f])=>{
        const g=base.filter(f);
        return g.length?`<h3 class="secao">${tit} (${g.length})</h3>`
          + grupoClientes(g).map(([c,ks])=>cartaoCliente(c,ks)).join(""):"";
      }).join("")
    + (base.length? "" : "<p class='meio-sub'>Nada por aqui — agenda limpa. ✨</p>");
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ filtroPlan=b.dataset.per; render(); });
  document.querySelectorAll("[data-pcol]").forEach(b=>b.onclick=()=>{ filtroPlanColab=b.dataset.pcol||null; render(); });
  ligarCartoes();
}

function ligarTarefas(){

async function decidirSugestao(id, status){
  const s=D.sugestoes.find(x=>x.id===id);
  if(status==="aceita" && s){
    const dados=s.dados||{};
    if(dados.exigencia_prazo && s.caso_id)
      await api(`/rest/v1/casos?id=eq.${s.caso_id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({exigencia_prazo:dados.exigencia_prazo,
          exigencia_descricao:dados.exigencia_descricao||s.texto.slice(0,300)})});
    if(dados.andamento && s.caso_id){
      const claude=D.colaboradores.find(c=>c.inicial==="C");
      await api(`/rest/v1/andamentos`,{method:"POST",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({caso_id:s.caso_id, autor_id:claude?claude.id:null, texto:dados.andamento})});
    }
    if(dados.mensagem) await copiar(dados.mensagem,"Mensagem copiada — cole no WhatsApp 💬");
  }
  await api(`/rest/v1/sugestoes?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({status, decidido_por:eu.id, decidido_em:new Date().toISOString()})});
  D.sugestoes=D.sugestoes.filter(x=>x.id!==id);
  aviso(status==="aceita"?"Sugestão aplicada ✔":"Descartada");
  montarSidebar(); render();
}

async function criarMencoes(texto, casoId, andamentoId, extras){
  const ids=new Set((extras||[]).filter(id=>id!==eu.id));
  D.colaboradores.forEach(co=>{ if(co.id!==eu.id && co.ativo &&
    (new RegExp("@"+co.nome.split(" ")[0]+"\\b","i").test(texto) ||
     new RegExp("@"+co.inicial+"\\b").test(texto))) ids.add(co.id); });
  const alvos=D.colaboradores.filter(co=>ids.has(co.id));
  for(const co of alvos)
    await api(`/rest/v1/mencoes`,{method:"POST",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({de_id:eu.id, para_id:co.id, caso_id:casoId,
        andamento_id:andamentoId, texto})});
  if(alvos.length) aviso("📥 "+alvos.map(a=>a.nome).join(", ")+" será(ão) avisado(s)");
}

    col.ondragleave=()=>col.classList.remove("solta");
    col.ondrop=async e=>{
      e.preventDefault(); col.classList.remove("solta");
      const id=e.dataTransfer.getData("text/lead"); if(!id) return;
      const l=D.leads.find(x=>x.id===id); if(!l || l.etapa===col.dataset.etapa) return;
      l.etapa=col.dataset.etapa;
      if(l.etapa==="perdido") l.motivo_perda=prompt("Motivo da perda (opcional):")||null;
      await api(`/rest/v1/leads?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({etapa:l.etapa, motivo_perda:l.motivo_perda||null,
          atualizado_em:new Date().toISOString()})});
      montarSidebar(); renderVendas();
    };
  });
}
async function novoLead(){

  const [l]=await api(`/rest/v1/leads`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify({nome, telefone:document.getElementById("nl-tel").value.trim()||null,
      beneficio_interesse:document.getElementById("nl-ben").value.trim()||null,
      origem:document.getElementById("nl-origem").value, responsavel_id:eu.id})});
  D.leads.unshift(l); renderVendas(); aviso("Prospecto no funil 💼");

async function leadParaCliente(leadId){
  const l=D.leads.find(x=>x.id===leadId); if(!l) return;
  const [cli]=await api(`/rest/v1/clientes`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify({nome:l.nome, telefone:l.telefone})});
  const [caso]=await api(`/rest/v1/casos`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify({cliente_id:cli.id, titulo:l.nome,
      beneficio:l.beneficio_interesse, fase:"escritorio"})});
  await api(`/rest/v1/atribuicoes`,{method:"POST",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({caso_id:caso.id, colaborador_id:eu.id})});
  await aplicarChecklistCaso(caso, true);
  await api(`/rest/v1/leads?id=eq.${leadId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({cliente_id:cli.id})});
  l.cliente_id=cli.id;
  await carregar(); montarSidebar();
  aviso("Cliente criado a partir da venda ✔"); abrirFicha(cli.id);
}

function copiarTrf3(casoId){
  const k=D.casoPorId.get(casoId); const t=k&&k.trf3; if(!t||!t.ordem) return;
  const dbr=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:"";
  const msg=`O processo nº ${t.processo} aguarda julgamento no TRF3 e hoje ocupa a posição ${t.ordem}`+
    (t.total?` de uma fila de ${t.total} processos`:"")+

    (t.turma?` (${t.turma})`:"")+`.`+
    (t.fase_desde?` Está concluso para julgamento desde ${dbr(t.fase_desde)}.`:"")+
    (t.prioridade==="S"?" O processo tramita com prioridade.":"")+
    ` Fonte: painel público de estatísticas do TRF3 (consulta de ${dbr(t.consultado_em)}).`;
  copiar(msg,"Mensagem da ordem de julgamento copiada 💬");

function trilhaCaso(k){
  const passos=[...TRILHA, "pagamento", "encerrado"];
  const i=passos.indexOf(k.fase);
  const rot=f=> f==="pagamento" ? "💰 Pagamentos"
    : f==="encerrado" ? (k.fase==="encerrado"&&k.resultado?`✔ ${esc(k.resultado)}`:"✔ Encerrado")
    : NOME_FASE[f];
  return `<div class="fases-trilha">`
    + (i<0?`<button class="fase-et atual" disabled>${esc(NOME_FASE[k.fase]||k.fase)}</button>`:"")
    + passos.map((f,j)=>{
      const feita=i>=0&&j<i, atual=j===i;
      const acao = atual ? "disabled"
        : f==="encerrado" ? `onclick="janelaEncerrar('${k.id}')" title="encerrar: resultado + honorários"`
        : `onclick="moverFase('${k.id}','${f}')" title="clique para mover o caso para ${rot(f)}"`;

    }).join("")+`</div>`;

// datas em linguagem natural ("amanhã", "sexta", "dia 15") no adicionar tarefa
const DIAS_SEMANA={domingo:0,segunda:1,terca:2,"terça":2,quarta:3,quinta:4,sexta:5,sabado:6,"sábado":6};
function dataNatural(texto){
  const t0=new Date(hoje()+"T12:00:00");
  const tenta=[
    [/\bhoje\b/i, ()=>0],
    [/\bamanh[ãa](?![a-zà-ÿ])/i, ()=>1],
    [/\b(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)\b/i,
      m=>{ const alvo=DIAS_SEMANA[dsa(m[1])]; let d=(alvo-t0.getDay()+7)%7; return d||7; }],
    [/\bdia (\d{1,2})\b/i, m=>{ const d=new Date(t0); d.setDate(+m[1]); if(d<=t0) d.setMonth(d.getMonth()+1);
      return Math.round((d-t0)/864e5); }],
    [/\b(\d{1,2})[\/.](\d{1,2})\b/, m=>{ const d=new Date(t0.getFullYear(),+m[2]-1,+m[1],12);
      if(d<t0) d.setFullYear(d.getFullYear()+1); return Math.round((d-t0)/864e5); }],
  ];
  for(const [re,calc] of tenta){
    const m=texto.match(re);
    if(m){
      const d=new Date(t0); d.setDate(d.getDate()+calc(m));
      return {titulo:texto.replace(re,"").replace(/\s{2,}/g," ").trim(),
              prazo:d.toLocaleDateString("sv")};
    }
  }
  return {titulo:texto, prazo:null};
}

// "Perícia agendada para 19/08/2026 às 8:50..." no andamento -> evento na hora
// aceita "12/08/2026", "12/08" (ano deduzido: o próximo 12/08), "às 07h40",
// "às 7h" — e extrai TODOS os agendamentos do texto, não só o primeiro
const RE_EVENTO_JS=/(per[íi]cia|audi[êe]ncia|avalia[çc][ãa]o social)[^\n]{0,120}?\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{4}))?(?:[^\n]{0,20}?\b(\d{1,2})[:hH](\d{2})?)?/gi;
async function extrairEvento(texto, casoId){
  const criados=[];
  for(const m of texto.matchAll(RE_EVENTO_JS)){
    const tipo=/aud/i.test(m[1])?"Audiência":/avalia/i.test(m[1])?"Avaliação social":"Perícia";
    const dia=m[2].padStart(2,"0"), mes=m[3].padStart(2,"0");
    let data;
    if(m[4]) data=`${m[4]}-${mes}-${dia}`;
    else{
      data=`${hoje().slice(0,4)}-${mes}-${dia}`;             // sem ano = o próximo
      if(data<hoje()) data=`${+hoje().slice(0,4)+1}-${mes}-${dia}`;
    }
    const hora=m[5]?`${m[5].padStart(2,"0")}:${m[6]||"00"}`:"09:00";
    if(isNaN(new Date(data+"T00:00:00").getTime())) continue;
    if(D.eventos.some(e=>e.caso_id===casoId && e.tipo===tipo && e.data_hora.slice(0,10)===data)) continue;
    try{
      const [ev]=await api(`/rest/v1/eventos`,{method:"POST",headers:{Prefer:"return=representation"},
        body:JSON.stringify({caso_id:casoId, tipo, data_hora:`${data}T${hora}:00-03:00`,
          obs:texto.slice(0,160), status:data>=hoje()?"agendada":"realizada"})});
      D.eventos.push(ev);
      criados.push({tipo, data});
    }catch(e){}   // já existia (dedupe do banco) — segue o jogo
  }
  return criados.length?criados:null;
}
async function novoAndamento(casoUnico){
  const sel=document.getElementById("and-caso");
  const casoId = casoUnico || (sel && sel.value);
  const inp=document.getElementById("and-texto");
  if(!casoId || !inp.value.trim()) return;
  const kAlvo=D.casoPorId.get(casoId);
  if(kAlvo && kAlvo.fase==="encerrado") return aviso("✔ Processo encerrado — reabra pela trilha para comentar");
  if(avisarSel.size===0) return aviso("🔔 Escolha quem AVISAR — é obrigatório para registrar");
  const texto=inp.value.trim();
  const [and]=await api(`/rest/v1/andamentos`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify({caso_id:casoId, autor_id:eu.id, texto})});
  await criarMencoes(texto, casoId, and?and.id:null, [...avisarSel]);  // 🔔 AVISAR + @menções
  avisarSel.clear();
  const k=D.casoPorId.get(casoId);
  // protocolo citado entra na ficha e vira pesquisável ("protocolo 210...")
  const prot=texto.match(/protocolo\D{0,12}(\d{6,})/i);
  if(prot && k && !(k.protocolos||[]).includes(prot[1])){
    k.protocolos=[...(k.protocolos||[]), prot[1]];
    await api(`/rest/v1/casos?id=eq.${casoId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({protocolos:k.protocolos})});
    const cli=D.cliPorId.get(k.cliente_id);
    if(cli) cli._ix += " " + prot[1];
  }
  // "solicitei os documentos: X; Y" no atendimento -> sobe para o checklist
  let docsNovos=0;
  const mdoc=texto.match(/(?:document\w+\s+solicitad\w+|solicitad\w+[^:\n]{0,40}document\w+|solicitei[^:\n]{0,40}document\w+)[^:\n]*:\s*([^\n]+)/i);
  if(mdoc && k){
    const itens=mdoc[1].split(/[;,]/).map(x=>x.trim().replace(/\.$/,"")).filter(x=>x&&x.length<=80).slice(0,15);
    for(const it of itens){
      if(D.tarefas.some(t=>t.caso_id===casoId && t.titulo===`📄 ${it}` && !t.concluida)) continue;
      const [tf]=await api(`/rest/v1/tarefas`,{method:"POST",headers:{Prefer:"return=representation"},
        body:JSON.stringify({caso_id:casoId, titulo:`📄 ${it}`})});
      if(tf){ D.tarefas.push(tf); docsNovos++; }
    }
  }
  const sufixoDocs = docsNovos?` · 📄 ${docsNovos} doc(s) no checklist`:"";
  const evs=await extrairEvento(texto, casoId);         // perícias citadas viram agendamentos
  if(evs){
    montarSidebar();
    const nomes=evs.map(e=>`${e.tipo} ${fmt(e.data)}`).join(" e ");
    // próximo passo: perícia em caso judicial pede atendimento presencial antes
    const tituloProx="Agendar atendimento presencial antes da perícia (orientar o cliente)";
    if(k && k.fase==="judicial" && evs.some(e=>/per[íi]cia/i.test(e.tipo)) &&
       !D.tarefas.some(t=>t.caso_id===casoId && !t.concluida && t.titulo===tituloProx)){
      const [tf]=await api(`/rest/v1/tarefas`,{method:"POST",headers:{Prefer:"return=representation"},
        body:JSON.stringify({caso_id:casoId, titulo:tituloProx})});
      if(tf) D.tarefas.push(tf);
      aviso(`🩺 Agendado: ${nomes} — 💡 criei no checklist: agendar atendimento presencial antes${sufixoDocs}`);
    } else aviso(`🩺 Agendado automaticamente: ${nomes}!${sufixoDocs}`);
  }
  else aviso((prot?"Andamento registrado — protocolo 📄 guardado na ficha":"Andamento registrado — será replicado no To Do")+sufixoDocs);
  abrirFicha(clienteAberto);
}

// Os motivos prontos vivem no banco (lembrar_motivos), minerados do histórico
// real do To Do e editáveis no próprio app (✎): criar, renomear, remover e
// escolher em quais listas cada um aparece (listas vazio = todas).
const MOTIVOS_PADRAO=[    // reserva para quem ainda não rodou o schema novo
  "Pedir prorrogação do benefício","Cobrar documentos do cliente","Conferir resposta do INSS",
  "Verificar pagamento","Retornar contato com o cliente","Último dia do prazo"]
  .map(t=>({grupo:"Motivos",texto:t,listas:[],ativo:true}));
let lbEditando=false, lbMotivoEdit=null;
function lbMotivos(){
  const ms=(D.lembrarMotivos&&D.lembrarMotivos.length)?D.lembrarMotivos:MOTIVOS_PADRAO;
  return ms.filter(m=>m.ativo!==false);
}
function toggleLembrar(casoId){
  const b=document.getElementById("lembrar-box"); if(!b) return;
  ["frases-box","preenche-box","exig-box"].forEach(i=>{const e=document.getElementById(i); if(e) e.style.display="none";});
  if(b.style.display==="block"){ b.style.display="none"; return; }
  lbEditando=false; lbMotivoEdit=null;
  lbRender(casoId);
  b.style.display="block";
}
function lbRender(casoId){
  const b=document.getElementById("lembrar-box"); const k=D.casoPorId.get(casoId); if(!b||!k) return;
  const em=d=>{ const x=new Date(hoje()+"T12:00:00"); x.setDate(x.getDate()+d); return x.toLocaleDateString("sv"); };
  // preserva o que já estava digitado ao alternar o modo de edição
  const elData=document.getElementById("lb-data"), elMot=document.getElementById("lb-motivo");
  const dataAtual=elData?elData.value:(k.prazo||"");
  const motivoAtual=elMot?elMot.value:(k.lembrar_motivo||"");
  // só os motivos da lista (fase) deste caso — para não poluir; editando, todos
  const vis=lbMotivos().filter(m=>lbEditando || !(m.listas||[]).length || (m.listas||[]).includes(k.fase));
  const grupos=[], porGrupo=new Map();
  vis.forEach(m=>{ if(!porGrupo.has(m.grupo)){porGrupo.set(m.grupo,[]); grupos.push(m.grupo);} porGrupo.get(m.grupo).push(m); });
  b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <strong style="font-size:13px">🗓 Lembrar em — a AGENDA do caso (quando agir e por quê)</strong>
      <button class="btn-mini" onclick="lbEditar('${casoId}')">${lbEditando?"✔ concluir edição":"✎ editar motivos"}</button>
    </div>
    <p class="meio-sub" style="margin:2px 0 6px">${lbEditando
      ?"Clique num motivo para alterá-lo, no ✕ para removê-lo, ou crie um novo abaixo. Sem lista marcada = aparece em todas."
      :"Marca a data de agir (aparece nas listas) — e pode registrar um comentário com a data, como sempre fazemos."}</p>
    <div class="form-linha" style="margin-top:4px;align-items:center">
      ${[["Hoje",0],["Amanhã",1],["+7 dias",7],["+15 dias",15],["+30 dias",30]].map(([r,d])=>
        `<button class="btn-mini" onclick="setLbData('${em(d)}')">${r}</button>`).join("")}
      <input type="date" id="lb-data" value="${dataAtual}" oninput="lbPreview()">
      <strong id="lb-preview" style="font-size:13px;color:var(--azul)"></strong>
    </div>
    ${grupos.map(g=>`<div class="form-linha" style="align-items:center;gap:4px;margin:3px 0">
      <span class="meio-sub" style="min-width:86px;font-weight:600">${esc(g)}</span>
      ${porGrupo.get(g).map(m=>lbEditando
        ?`<span style="display:inline-flex;align-items:center;gap:2px"><button class="btn-mini" title="clique para alterar" onclick="lbCarregarForm('${m.id||""}')">${esc(m.texto)}</button><a style="cursor:pointer;color:#B3261E;font-weight:700;padding:0 3px" title="remover" onclick="lbDesativar('${casoId}','${m.id||""}')">✕</a></span>`
        :`<button class="btn-mini" onclick="document.getElementById('lb-motivo').value=this.textContent">${esc(m.texto)}</button>`).join("")}
    </div>`).join("")}
    ${lbEditando?lbFormHtml(casoId):`<div class="form-linha">
      <input id="lb-motivo" placeholder="por que lembrar? (ex.: pedir prorrogação)" style="flex:1;min-width:220px">
      <button onclick="salvarLembrar('${k.id}')">Salvar lembrete</button>
      ${k.prazo?`<button class="btn-mini" onclick="limparLembrar('${k.id}')">limpar</button>`:""}
    </div>
    <label style="font-size:12.5px;display:flex;gap:6px;align-items:center;margin-top:2px;cursor:pointer">
      <input type="checkbox" id="lb-comentar" checked>
      📝 Registrar comentário com a data — ex.: “Verificar HISCRE em 12/02/2026.” (vai para o To Do também)
    </label>`}`;
  const mi=document.getElementById("lb-motivo"); if(mi) mi.value=motivoAtual;
  lbPreview();
}
function lbEditar(casoId){ lbEditando=!lbEditando; lbMotivoEdit=null; lbRender(casoId); }
function lbFormHtml(casoId){
  const grupos=[...new Set(lbMotivos().map(m=>m.grupo))];
  const FL=[["escritorio","🙋 Escritório"],["inss","🌻 INSS"],["conselho","🖥 Conselho"],["judicial","👪 Judicial"],
            ["pagamento","💰 Pagamentos"],["peticao_inicial","💡 Petições"],["aposentadoria_futura","🙏 Apos. Futuras"]];
  return `<div style="border-top:1px dashed var(--borda);margin-top:6px;padding-top:6px">
    <strong style="font-size:12.5px" id="lbm-titulo">＋ Novo motivo</strong>
    <div class="form-linha" style="margin-top:4px">
      <input id="lbm-texto" placeholder="texto do motivo — ex.: Conferir CNIS" style="flex:1;min-width:220px">
      <select id="lbm-grupo" onchange="document.getElementById('lbm-grupo-novo').style.display=this.value==='__novo__'?'':'none'">
        ${grupos.map(g=>`<option>${esc(g)}</option>`).join("")}<option value="__novo__">— novo grupo —</option>
      </select>
      <input id="lbm-grupo-novo" placeholder="nome do novo grupo" style="display:none;min-width:150px">
    </div>
    <div class="form-linha" style="align-items:center;font-size:12.5px;gap:8px;flex-wrap:wrap">
      <span class="meio-sub">Aparece em:</span>
      ${FL.map(([f,n])=>`<label style="display:flex;gap:3px;align-items:center;cursor:pointer"><input type="checkbox" class="lbm-lista" value="${f}">${n}</label>`).join("")}
    </div>
    <div class="form-linha">
      <button onclick="lbSalvarMotivo('${casoId}')">Salvar motivo</button>
      <button class="btn-mini" onclick="lbMotivoEdit=null;lbRender('${casoId}')">limpar</button>
    </div></div>`;
}
function lbCarregarForm(id){
  const m=lbMotivos().find(x=>x.id===id); if(!m) return;
  lbMotivoEdit=id;
  document.getElementById("lbm-titulo").textContent="✎ Alterando: "+m.texto;
  document.getElementById("lbm-texto").value=m.texto;
  const sel=document.getElementById("lbm-grupo");
  if([...sel.options].some(o=>o.value===m.grupo)) sel.value=m.grupo;
  document.getElementById("lbm-grupo-novo").style.display="none";
  document.querySelectorAll(".lbm-lista").forEach(c=>c.checked=(m.listas||[]).includes(c.value));
}
async function lbSalvarMotivo(casoId){
  const texto=document.getElementById("lbm-texto").value.trim();
  if(!texto) return aviso("Escreva o texto do motivo");
  let grupo=document.getElementById("lbm-grupo").value;
  if(grupo==="__novo__") grupo=document.getElementById("lbm-grupo-novo").value.trim()||"🙋 Cliente";
  const listas=[...document.querySelectorAll(".lbm-lista:checked")].map(c=>c.value);
  try{
    if(lbMotivoEdit){
      await api(`/rest/v1/lembrar_motivos?id=eq.${lbMotivoEdit}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({texto,grupo,listas})});
      const m=(D.lembrarMotivos||[]).find(x=>x.id===lbMotivoEdit); if(m) Object.assign(m,{texto,grupo,listas});
      aviso("Motivo alterado ✎");
    } else {
      const ordem=Math.max(0,...lbMotivos().map(m=>m.ordem||0))+1;
      const [novo]=await api(`/rest/v1/lembrar_motivos`,{method:"POST",headers:{Prefer:"return=representation"},
        body:JSON.stringify({texto,grupo,listas,ordem})});
      if(novo) (D.lembrarMotivos=D.lembrarMotivos||[]).push(novo);
      aviso("Motivo criado ＋");
    }
  }catch(e){ return aviso("Rode o schema.sql mais novo no Supabase para editar os motivos"); }
  lbMotivoEdit=null; lbRender(casoId);
}
async function lbDesativar(casoId,id){
  if(!id) return aviso("Rode o schema.sql mais novo no Supabase para editar os motivos");
  try{
    await api(`/rest/v1/lembrar_motivos?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({ativo:false})});
  }catch(e){ return aviso("Rode o schema.sql mais novo no Supabase para editar os motivos"); }
  const m=(D.lembrarMotivos||[]).find(x=>x.id===id); if(m) m.ativo=false;
  aviso("Motivo removido"); lbRender(casoId);
}
function diaSemana(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long"});
}
function setLbData(v){ document.getElementById("lb-data").value=v; lbPreview(); }
function lbPreview(){
  const v=document.getElementById("lb-data").value;
  document.getElementById("lb-preview").textContent = v ? `→ ${diaSemana(v)}, ${fmt(v)}` : "";
}
async function salvarLembrar(casoId){
  const k=D.casoPorId.get(casoId); if(!k) return;
  const antes={prazo:k.prazo, motivo:k.lembrar_motivo};
  k.prazo=document.getElementById("lb-data").value||null;
  k.lembrar_motivo=document.getElementById("lb-motivo").value.trim()||null;
  await api(`/rest/v1/casos?id=eq.${casoId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({prazo:k.prazo, lembrar_motivo:k.lembrar_motivo})});
  // hábito do escritório: o comentário guarda a data escolhida — se alguém
  // mudar o lembrete depois, a data original fica na linha do tempo e no To Do
  const cb=document.getElementById("lb-comentar");
  let comentou=false;
  if(cb && cb.checked && k.prazo && k.lembrar_motivo &&
     (k.prazo!==antes.prazo || k.lembrar_motivo!==antes.motivo)){
    const dataBr=`${k.prazo.slice(8,10)}/${k.prazo.slice(5,7)}/${k.prazo.slice(0,4)}`;
    await api(`/rest/v1/andamentos`,{method:"POST",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({caso_id:casoId, autor_id:eu.id, texto:`${k.lembrar_motivo} em ${dataBr}.`})});
    comentou=true;
  }
  aviso(k.prazo?`Lembrete salvo: ${diaSemana(k.prazo)}, ${fmt(k.prazo)}${k.lembrar_motivo?" — "+k.lembrar_motivo:""}${comentou?" · 📝 comentário registrado":""} 🗓`:"Lembrete salvo");
  montarSidebar(); if(clienteAberto) abrirFicha(clienteAberto);
}
async function limparLembrar(casoId){
  const k=D.casoPorId.get(casoId); if(!k) return;
  k.prazo=null; k.lembrar_motivo=null;
  await api(`/rest/v1/casos?id=eq.${casoId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({prazo:null, lembrar_motivo:null})});
  aviso("Lembrete removido"); montarSidebar(); if(clienteAberto) abrirFicha(clienteAberto);
}

// preenchimento guiado das frases: __/__/____ vira campo de data, __:__ de
// hora e ____ de texto — nada de apagar tracinhos na mão
function montarPreenchimento(texto){
  const box=document.getElementById("preenche-box");
  const partes=texto.split(/(__\/__\/____|__:__|____)/);
  let n=0;
  box.innerHTML = `<strong style="font-size:13px">⚡ Complete a frase:</strong>
    <div style="margin:8px 0;line-height:2.1">` + partes.map(p=>{
      if(p==="__/__/____") return `<input type="date" class="pr-campo" data-t="data" id="pr-${n++}" style="padding:3px 6px;border:1px solid var(--borda);border-radius:6px">`;
      if(p==="__:__")      return `<input type="time" class="pr-campo" data-t="hora" id="pr-${n++}" style="padding:3px 6px;border:1px solid var(--borda);border-radius:6px">`;
      if(p==="____")       return `<input type="text" class="pr-campo" data-t="txt" id="pr-${n++}" placeholder="…" style="padding:3px 6px;border:1px solid var(--borda);border-radius:6px;width:150px">`;
      return `<span data-fixo>${esc(p)}</span>`;
    }).join("") + `</div>
    <button onclick="inserirPreenchida()">➡ Inserir no andamento</button>
    <button class="btn-mini" onclick="document.getElementById('preenche-box').style.display='none'">cancelar</button>`;
  box.dataset.partes=JSON.stringify(partes);
  box.style.display="block";
  const primeiro=box.querySelector(".pr-campo"); if(primeiro) primeiro.focus();
}
function inserirPreenchida(){
  const box=document.getElementById("preenche-box");
  const partes=JSON.parse(box.dataset.partes);
  const campos=[...box.querySelectorAll(".pr-campo")];
  let i=0;
  const texto=partes.map(p=>{
    if(p==="__/__/____"||p==="__:__"||p==="____"){
      const el=campos[i++]; const v=el.value;
      if(!v) return p;                       // não preencheu: fica o tracinho mesmo
      if(el.dataset.t==="data") return fmt(v).replace(/\./g,"/");
      return v;
    }
    return p;
  }).join("");
  const inp=document.getElementById("and-texto");
  inp.value=texto; box.style.display="none"; inp.focus();
}
async function novoCaso(cliId){
  const ben=document.getElementById("nk-ben").value.trim()||null;
  const fase=document.getElementById("nk-fase").value;
  const prazo=document.getElementById("nk-prazo").value||null;
  const c=D.cliPorId.get(cliId);
  const [k]=await api(`/rest/v1/casos`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify({cliente_id:cliId, titulo:`${c.nome}${c.cpf?" #"+c.cpf:""}`,
      beneficio:ben, fase, prazo, origem_lista:(LISTAS_MOVER.find(([,f])=>f===fase)||["🙋 Escritório"])[0]})});
  D.casos.push(k); D.casoPorId.set(k.id,k);
  if(!D.casosDoCliente.has(cliId)) D.casosDoCliente.set(cliId,[]);
  D.casosDoCliente.get(cliId).push(k);
  plim(); aviso("Caso criado — a sincronização cria a tarefa no To Do 📋");
  montarSidebar(); casoSel=k.id; abaAtiva=2; abrirFicha(cliId);
}
async function novaFrase(){
  const inp=document.getElementById("nf-texto");
  const t=inp.value.trim(); if(!t) return;
  try{
    const [f]=await api(`/rest/v1/frases_prontas`,{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({texto:t})});
    if(f) D.frases.push(f);
  }catch(e){ if(e.status!==409) throw e; }
  D.frases.sort((a,b)=>a.texto<b.texto?-1:1);
  inp.value=""; aviso("Frase salva ⚡ — aparece para toda a equipe");
  abrirFicha(clienteAberto);
}
async function novoEvento(){

  if(!data) return aviso("Escolha a data");
  const linha={caso_id:document.getElementById("ne-caso").value,
    tipo:document.getElementById("ne-tipo").value,
    data_hora:data+"T"+(document.getElementById("ne-hora").value||"09:00")+":00-03:00",
    local:document.getElementById("ne-local").value||null};
  const [nova]=await api(`/rest/v1/eventos`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify(linha)});
  D.eventos.push(nova); aviso("Agendado 🩺"); montarSidebar(); abrirFicha(clienteAberto);
}
async function novoPgto(){
  const casoId=document.getElementById("np-caso").value;
  if(!casoId) return aviso("Este cliente ainda não tem caso — crie um antes");
  const valor=document.getElementById("np-valor").value;
  if(!valor) return aviso("Informe o valor");
  const data=document.getElementById("np-data").value||hoje();
  const desc=document.getElementById("np-desc").value.trim();
  const recebido = data<=hoje();   // data futura = a receber (vencimento)
  const linha={caso_id:casoId, descricao:desc||"Recebimento", valor,
    status:recebido?"recebido":"aberto",
    pago_em:recebido?data:null, vencimento:recebido?null:data,
    conferencias:recebido?[{c:eu.id,em:new Date().toISOString()}]:[]};
  const [novo]=await api(`/rest/v1/pagamentos`,{method:"POST",headers:{Prefer:"return=representation"},
    body:JSON.stringify(linha)});
  D.pagamentos.push(novo);
  aviso(recebido?"Recebimento registrado 💵 — você consta como quem recebeu":"Lançado a receber 💰");
  abrirFicha(clienteAberto);
}
function lembreteDoEvento(evId){
  const e=D.eventos.find(x=>x.id===evId); if(!e) return null;
  const k=D.casoPorId.get(e.caso_id), c=k&&D.cliPorId.get(k.cliente_id);
  const ctx = e.tipo.toLowerCase().includes("aud") ? "audiencia" : "pericia";
  const m = modeloPor(ctx) || D.modelos[0];
  return {texto: preencher(m.texto, c, e, null), cli: c};
}

// encerrar caso: janela de resultado -> honorários (lançados no Pagamentos)
function fecharJanela(){ const j=document.getElementById("janela"); if(j) j.remove(); }
function janelaEncerrar(casoId){
  fecharJanela();
  const k=D.casoPorId.get(casoId);
  const div=document.createElement("div"); div.id="janela";
  const ROT={deferido:"✅ Deferido",acordo:"🤝 Acordo",indeferido:"❌ Indeferido",desistencia:"🚪 Desistência"};
  div.innerHTML=`<div class="jan-caixa">
    <h3>✔ Encerrar: ${esc(tituloCaso(k))}</h3>
    <p class="meio-sub">Qual foi o resultado?</p>
    <div class="form-linha">${Object.entries(ROT).map(([r,n])=>`<button class="btn-res" data-res="${r}">${n}</button>`).join("")}</div>
    <div id="jan-hon" style="display:none;margin-top:12px;border-top:1px solid var(--borda);padding-top:10px">
      <p class="meio-sub">💰 Honorários — lança no menu Pagamentos (opcional):</p>
      <div class="form-linha">
        <input id="hon-valor" type="number" step="0.01" placeholder="R$ honorários" style="width:140px">
        <input id="hon-venc" type="date" title="vencimento / previsão de recebimento">
        <button id="hon-lancar">Lançar e encerrar</button>
        <button class="btn-mini" id="hon-pular">encerrar sem lançar</button>
      </div>
    </div>
    <button class="btn-mini" id="jan-cancela" style="margin-top:12px">cancelar</button>
  </div>`;
  document.body.appendChild(div);
  let resultado=null;
  div.querySelectorAll(".btn-res").forEach(b=>b.onclick=()=>{
    resultado=b.dataset.res;
    div.querySelectorAll(".btn-res").forEach(x=>x.style.outline = x===b ? "2px solid var(--azul)" : "");
    document.getElementById("jan-hon").style.display="block";
    document.getElementById("hon-valor").focus();
  });
  const encerrar=async(lancar)=>{
    if(!resultado) return aviso("Escolha o resultado primeiro");
    k.fase="encerrado"; k.resultado=resultado; k.encerrado_em=new Date().toISOString();
    await api(`/rest/v1/casos?id=eq.${k.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({fase:"encerrado", resultado, encerrado_em:k.encerrado_em})});
    await api(`/rest/v1/andamentos`,{method:"POST",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({caso_id:k.id, autor_id:eu.id,
        texto:`Caso encerrado — resultado: ${resultado.toUpperCase()}.${resultado==="deferido"?" 🎉":""}`})});
    if(lancar){
      const v=document.getElementById("hon-valor").value;
      if(v){
        const venc=document.getElementById("hon-venc").value||null;
        const recebido = venc && venc<=hoje();
        const [pg]=await api(`/rest/v1/pagamentos`,{method:"POST",headers:{Prefer:"return=representation"},
          body:JSON.stringify({caso_id:k.id, descricao:"Honorários", valor:v,
            status:recebido?"recebido":"aberto", pago_em:recebido?venc:null,
            vencimento:recebido?null:venc,
            conferencias:recebido?[{c:eu.id,em:new Date().toISOString()}]:[]})});
        if(pg) D.pagamentos.push(pg);
      }
    }
    fecharJanela(); plim();
    aviso(`Caso encerrado: ${resultado}${lancar?" — honorários no 💰 Pagamentos":""}`);
    montarSidebar(); if(clienteAberto) abrirFicha(clienteAberto);
  };
  document.getElementById("hon-lancar").onclick=()=>encerrar(true);
  document.getElementById("hon-pular").onclick=()=>encerrar(false);
  document.getElementById("jan-cancela").onclick=()=>{ fecharJanela(); if(clienteAberto) abrirFicha(clienteAberto); };
}

// ── catálogo de documentos (espelho do site interno) ──────────────────────
function docPorNome(nome){ return D.docs.find(d=>d.beneficio===nome); }
let _docLinhas=[];   // linhas exibidas no catálogo (índice = checkbox)
function renderDocCatalogo(){
  const alvo=document.getElementById("doc-conteudo"); if(!alvo) return;
  const d=docPorNome(document.getElementById("doc-ben").value);
  if(!d){ alvo.innerHTML="<p class='meio-sub'>Escolha um benefício.</p>"; return; }
  _docLinhas=[];
  const linha=(txt,marcado)=>{
    if(txt.startsWith("▸ "))
      return `<div class="cc-tit" style="color:var(--cinza);padding:8px 0 3px">${esc(txt.slice(2))}</div>`;
    const i=_docLinhas.push(txt)-1;
    return `<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0;cursor:pointer">
      <input type="checkbox" class="doc-it" data-di="${i}" ${marcado?"checked":""} style="margin-top:3px">
      <span>${esc(txt)}</span></label>`;
  };
  const base=(d.itens||"").split("\n").filter(x=>x.trim());
  const extras=(d.extras||"").split("\n").filter(x=>x.trim());
  alvo.innerHTML =
    base.map(l=>linha(l,true)).join("")
    + (extras.length?`<div class="cc-tit" style="color:var(--laranja);padding:12px 0 3px">Conforme a atividade do cliente — marque o que se aplica</div>`
        + extras.map(l=>linha(l,false)).join(""):"")
    + ((d.observacoes)?`<p class="meio-sub" style="white-space:pre-wrap;margin-top:10px;background:var(--fundo);border-radius:8px;padding:10px">${esc(d.observacoes)}</p>`:"")
    + `<div class="form-linha" style="margin-top:10px">
        <button onclick="solicitarDocsCatalogo()">🖨 Imprimir e solicitar (vira checklist)</button>
      </div>`;
}
async function solicitarDocsCatalogo(){
  const ben=document.getElementById("doc-ben").value;
  const dest=document.getElementById("doc-destino").value;
  const itens=[...document.querySelectorAll("#doc-conteudo .doc-it:checked")]
    .map(x=>_docLinhas[+x.dataset.di]).filter(Boolean);
  if(!itens.length) return aviso("Marque ao menos um documento");
  let casoId=dest, k;
  if(dest==="__novo__"){
    const c=D.cliPorId.get(clienteAberto);
    const [nk]=await api(`/rest/v1/casos`,{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({cliente_id:clienteAberto, titulo:`${c.nome}${c.cpf?" #"+c.cpf:""}`,
        beneficio:ben, fase:"escritorio", origem_lista:"🙋 Escritório"})});
    D.casos.push(nk); D.casoPorId.set(nk.id,nk);
    if(!D.casosDoCliente.has(clienteAberto)) D.casosDoCliente.set(clienteAberto,[]);
    D.casosDoCliente.get(clienteAberto).push(nk);
    casoId=nk.id; k=nk;
  } else k=D.casoPorId.get(casoId);
  if(!k) return aviso("Escolha o caso de destino");
  imprimirListaDocs(D.cliPorId.get(k.cliente_id), ben, itens, (docPorNome(ben)||{}).observacoes);
  let novos=0;
  for(const it of itens){
    const titulo=`📄 ${it.split(" — ")[0]}`;
    if(D.tarefas.some(t=>t.caso_id===casoId && t.titulo===titulo && !t.concluida)) continue;
    const [tf]=await api(`/rest/v1/tarefas`,{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({caso_id:casoId, titulo})});
    if(tf){ D.tarefas.push(tf); novos++; }
  }
  // sem dois-pontos de propósito: o padrão "documentos solicitados: X" é o
  // gatilho do checklist automático — aqui os itens já foram criados acima
  await api(`/rest/v1/andamentos`,{method:"POST",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({caso_id:casoId, autor_id:eu.id,
      texto:`📄 Lista de documentos de ${ben} impressa e solicitada ao cliente — ${itens.length} item(ns) no checklist do caso.`})});
  plim();
  aviso(dest==="__novo__"?`Caso novo criado + checklist com ${novos} documento(s) 📄`:`Checklist criado: ${novos} documento(s) 📄`);
  montarSidebar(); casoSel=casoId; abaAtiva=2; abrirFicha(clienteAberto);
}

// checklist-modelo por benefício -> caso novo já nasce com o passo a passo
function cklDe(beneficio){
  if(!beneficio) return null;
  const b=dsa(beneficio);
  return D.ckls.find(x=>dsa(x.beneficio)===b)
      || D.ckls.find(x=>b.includes(dsa(x.beneficio)) || dsa(x.beneficio).includes(b));
}
async function aplicarChecklistCaso(caso, silencioso){
  const modelo=cklDe(caso.beneficio);
  if(!modelo) return 0;
  const existentes=new Set(D.tarefas.filter(t=>t.caso_id===caso.id).map(t=>dsa(t.titulo)));
  const novos=modelo.itens.split("\n").map(x=>x.trim()).filter(x=>x && !existentes.has(dsa(x)));
  for(const titulo of novos){
    const [t]=await api(`/rest/v1/tarefas`,{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({caso_id:caso.id, titulo})});
    D.tarefas.push(t);
  }
  if(!silencioso && novos.length) aviso(`Checklist do benefício aplicado — ${novos.length} etapas 📋`);
  return novos.length;
}

// modelos de documentos ({nome},{cpf},{nb}... preenchidos com o cliente)
function preencherDoc(conteudo, c, k){
  const dataExt=new Date(hoje()+"T12:00:00").toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
  const mapa={
    "{nome}": c?c.nome:"", "{primeiro_nome}": c?c.nome.split(" ")[0]:"",
    "{cpf}": c?fmtCpf(c.cpf):"", "{endereco}": (c&&c.endereco)||"____________________",
    "{telefone}": (c&&c.telefone)||"", "{nb}": (k&&k.nb)||"____________",
    "{processo}": (k&&k.processo)||"____________", "{beneficio}": (k&&k.beneficio)||"benefício previdenciário",
    "{data}": dataExt,
  };
  return Object.entries(mapa).reduce((t,[ph,v])=>t.split(ph).join(v), conteudo);
}
function gerarDocumento(modeloId, cliId){
  const m=D.docModelos.find(x=>x.id===modeloId), c=D.cliPorId.get(cliId);
  if(!m||!c) return;
  const k=(D.casosDoCliente.get(cliId)||[]).find(x=>x.fase!=="encerrado");
  const corpo=preencherDoc(m.conteudo, c, k);
  const w=window.open("","_blank");
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
  <title>${esc(m.titulo)} — ${esc(c.nome)}</title><style>
    body{font-family:Georgia,serif;max-width:700px;margin:40px auto;color:#111;line-height:1.8;font-size:15px}
    pre{white-space:pre-wrap;font:inherit}
    @media print{body{margin:15mm}}
  </style></head><body><pre>${esc(corpo)}</pre>
  <script>window.print()<\/script></body></html>`);
  w.document.close();
}

// documentos por benefício -> carta imprimível para o cliente
function docDe(beneficio){
  if(!beneficio) return null;
  const b=dsa(beneficio);
  return D.docs.find(d=>dsa(d.beneficio)===b)
      || D.docs.find(d=>b.includes(dsa(d.beneficio)) || dsa(d.beneficio).includes(b));
}
function imprimirDocs(casoId){
  const k=D.casoPorId.get(casoId), doc=docDe(k.beneficio);

    (doc.itens||"").split("\n").filter(x=>x.trim()&&!x.startsWith("▸ ")), doc.observacoes);
}

  <h2>Providenciar e trazer ao escritório:</h2>

  ${obs?`<div class="obs">💡 ${esc(obs).replace(/\n/g,"<br>")}</div>`:""}
  <footer>Dúvidas? Fale conosco pelo WhatsApp. Pode enviar fotos dos documentos por lá, desde que legíveis.</footer>

function editarDocs(casoId){
  const k=D.casoPorId.get(casoId), doc=docDe(k.beneficio), div=document.getElementById("doc-editor-"+casoId);

async function salvarDocs(casoId){
  const k=D.casoPorId.get(casoId), doc=docDe(k.beneficio);
  doc.itens=document.getElementById("doc-txt-"+casoId).value;
  doc.observacoes=document.getElementById("doc-obs-"+casoId).value||null;
  await api(`/rest/v1/documentos_beneficio?id=eq.${doc.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({itens:doc.itens, observacoes:doc.observacoes})});
  aviso("Lista de documentos atualizada 📋"); abrirFicha(clienteAberto);
}
async function copiar(texto, msg){
  try{ await navigator.clipboard.writeText(texto); }
  catch{  // fallback (contexto sem clipboard API)
    const ta=document.createElement("textarea");
    ta.value=texto; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  aviso(msg||"Copiado 📋");
}
