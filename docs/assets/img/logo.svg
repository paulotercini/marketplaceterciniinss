<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Advocacia Previdenciária">
  <!-- Marca do escritório: dois picos ("M") + conchas da balança da Justiça. -->
  <!-- pico da direita (cinza claro) -->
  <polygon points="140,16 210,150 188,150 140,66 92,150 72,150" fill="#8b8e92"/>
  <!-- pico da esquerda (cinza escuro), à frente -->
  <polygon points="92,44 152,150 130,150 92,92 50,150 30,150" fill="#54565a"/>
  <!-- concha esquerda (cinza) -->
  <path d="M44 150 Q92 150 122 156 Q92 187 44 150 Z" fill="#6c6e72"/>
  <!-- concha direita (vermelho), maior e à frente -->
  <path d="M98 150 Q150 150 208 141 Q150 201 98 150 Z" fill="#a82a2b"/>
</svg>
