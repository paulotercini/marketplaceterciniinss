name: Organizar em lote (uma vez)
on:
  push:
    branches: [claude/project-thread-30f8vi]
    paths: [crm/fase2/lote/organizar_lote.js, .github/workflows/lote-organizar.yml]
jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node crm/fase2/lote/organizar_lote.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTH_ID: 741525d4-5852-4c9e-b9cb-0e3ad92e1100
          ESCREVER: "0"
