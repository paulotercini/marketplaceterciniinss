name: CRM — organizar casos em lote

# F840 · roda o "Organizar todos pelos documentos" do próprio CRM (crm/fase2/lote/organizar_lote.js) no banco,
# só quando chamado à mão. Sem "escrever", apenas conta os passos. "clientes" limita a gravação (piloto).
# O log é público: só contagens.
on:
  workflow_dispatch:
    inputs:
      escrever:
        description: "Gravar no banco (1) ou apenas contar (0)"
        default: "0"
      clientes:
        description: "Ids dos clientes, separados por vírgula (vazio = todos os que têm plano)"
        default: ""

concurrency:
  group: crm-lote-organizar
  cancel-in-progress: false

jobs:
  organizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crm/fase2/testes/cadastro
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ESCREVER: ${{ inputs.escrever }}
      CLIENTES: ${{ inputs.clientes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.cache/ms-playwright
            crm/fase2/testes/cadastro/node_modules
          key: pw2-${{ runner.os }}-${{ hashFiles('crm/fase2/testes/cadastro/package.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund && npx playwright install chromium-headless-shell
      - name: O navegador abre?
        run: |
          abre='require("playwright").chromium.launch().then(b=>b.close())'
          node -e "$abre" || { npx playwright install --with-deps chromium-headless-shell && node -e "$abre"; }
      - run: NODE_PATH="$PWD/node_modules" node ../../lote/organizar_lote.js
