name: CRM — ordem de julgamento no TRF3

on:
  schedule:
    # uma vez por dia útil, 07h30 BRT (10h30 UTC) — a carga do painel é diária
    - cron: '30 10 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: trf3-ordem
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica segredos do Supabase
        id: seg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos SUPABASE_URL/SUPABASE_SERVICE_KEY ausentes — consulta pulada."
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Painel do TRF3 -> casos.trf3 (posição na ordem de julgamento)
        if: steps.seg.outputs.tem == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/trf3_ordem.py
