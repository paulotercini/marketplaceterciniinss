name: Deploy site (GitHub Pages)

on:
  # Publica automaticamente a cada push na main que altere o site (docs/) ou
  # este próprio workflow. Requer GitHub Pages com Source = "GitHub Actions".
  # O deploy também pode ser disparado sob demanda (workflow_dispatch).
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # PORTÃO. Até 30.08.2026 a publicação não consultava ninguém: um app.html
  # quebrado ia ao ar do mesmo jeito, e o escritório descobria pelo próprio
  # uso. As três suítes existem e são rápidas — agora elas decidem.
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest cryptography
      - name: Extração do portal (pytest)
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regras e robôs (node --test)
        run: node --test "crm/fase2/*/testes/*.test.js"

      # O que vai ao ar é docs/crm/index.html; o que a suíte de tela exercita
      # é crm/fase2/app.html. Se os dois divergirem, o verde não vale nada —
      # estaríamos aprovando um arquivo e publicando outro. O publicar.py
      # mantém a cópia; esta conferência é a prova de que ele rodou.
      - name: O publicado é o arquivo testado
        run: |
          if ! cmp -s crm/fase2/app.html docs/crm/index.html; then
            echo "::error::docs/crm/index.html difere de crm/fase2/app.html."
            echo "Rode 'python3 crm/publicar.py' e faça commit da cópia."
            exit 1
          fi
          echo "idêntico ($(wc -c < docs/crm/index.html) bytes)"

      # A suíte de tela (59 provas, ~9 min) já decidiu o merge no PR e roda de
      # novo na main pelo testes-tela.yml, em paralelo a este deploy. Repeti-la
      # aqui atrasava toda publicação em 9 minutos sem proteger nada a mais.

  deploy:
    needs: conferir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # F381 · o programa sai da página para app.<hash>.js, que o celular guarda já
      # compilado. Roda só aqui, no artefato: o repositório continua com o app.html testado.
      - name: Separar o programa da página
        run: python3 crm/separar.py docs/crm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
