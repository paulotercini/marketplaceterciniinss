name: Deploy site (GitHub Pages)

on:
  # Publica automaticamente a cada push na main que altere o site (docs/) ou
  # este próprio workflow. Requer GitHub Pages com Source = "GitHub Actions".
  # O deploy também pode ser disparado sob demanda (workflow_dispatch).
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
