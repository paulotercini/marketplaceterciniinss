# Aplica no Supabase as migrações novas de crm/fase2/migracoes/ quando entram na main,
# pela API de gerenciamento (segredo SUPABASE_ACCESS_TOKEN), sem janela de confirmação.
# Registro em public._migracoes; migração que apaga tabela, coluna ou dado é bloqueada
# sem a linha "-- destrutiva-confirmada:" (ver crm/fase2/aplicar_migracoes.py).
name: Migrações do Supabase

on:
  push:
    branches: [main]
    paths:
      - "crm/fase2/migracoes/**"
      - "crm/fase2/aplicar_migracoes.py"
      - ".github/workflows/supabase-migracoes.yml"
  pull_request:
    paths:
      - "crm/fase2/migracoes/**"
      - "crm/fase2/aplicar_migracoes.py"
  workflow_dispatch:

concurrency:
  group: supabase-migracoes
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir (sem banco)
        run: python3 crm/fase2/aplicar_migracoes.py --conferir
      - name: Aplicar no Supabase
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python3 crm/fase2/aplicar_migracoes.py
