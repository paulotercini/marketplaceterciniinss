name: CRM — consultas públicas (TRF3 + CNJ)

on:
  schedule:
    # duas vezes por dia útil: 07h30 e 14h30 BRT (10h30/17h30 UTC). A base é
    # diária, mas a API do DataJud tem manhãs em que pendura e a rodada morre
    # (04, 06 e 10.08 terminaram "cancelled") — a rodada da tarde é a segunda
    # chance do MESMO dia, para o CNJ não passar 48h sem atualizar.
    - cron: '30 10 * * 1-5'
    - cron: '30 17 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: consultas-publicas
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica segredos do Supabase
        id: seg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos SUPABASE_URL/SUPABASE_SERVICE_KEY ausentes — consultas puladas."
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CNJ/DataJud -> casos.datajud (andamento oficial de qualquer instância)
        if: steps.seg.outputs.tem == 'true'
        # teto do PASSO abaixo do teto do job: se o DataJud pendurar além do
        # que o próprio script tolera, o passo cai como FALHA visível e os
        # passos seguintes (Justiça em Números, TRF3) ainda rodam — antes o
        # job inteiro morria "cancelled", que ninguém percebe.
        timeout-minutes: 24
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/datajud.py

      - name: Justiça em Números (CNJ) -> orgao_producao (velocidade do órgão)
        if: always() && steps.seg.outputs.tem == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/cnj_producao.py

      - name: Painel do TRF3 -> casos.trf3 (posição + previsão de julgamento)
        if: always() && steps.seg.outputs.tem == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/trf3_ordem.py
