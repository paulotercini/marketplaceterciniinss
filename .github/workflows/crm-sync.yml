name: CRM — sincronização To Do → banco
# o nome de cada rodada diz quem a disparou (o 🩺 do CRM mostra isso)
run-name: ${{ github.event_name == 'schedule' && 'rodada de reserva do GitHub' || inputs.auditar == 'sim' && 'rodada com auditoria' || inputs.origem == 'automatica' && 'rodada automática' || 'disparo manual' }}

on:
  schedule:
    # RESERVA. Desde a E3 (29.09.2026) quem dispara a cada 10 minutos, das
    # 07h00 às 20h50, é o próprio banco (crm/fase2/schema_disparo.sql), porque
    # este agendamento atrasa e descarta rodadas: das 28 marcas por dia,
    # rodavam de 3 a 5. Fica como reserva para o dia em que o token do disparo
    # vencer. Minuto fora do pico (24.09.2026): no :00 o GitHub descarta mais.
    - cron: '13,43 10-23 * * *'
  workflow_dispatch:
    inputs:
      origem:
        description: 'quem disparou (automatica = o banco, a cada 10 minutos)'
        required: false
        default: 'manual'
      auditar:
        description: 'sim = roda também a auditoria To Do × CRM'
        required: false
        default: 'nao'

concurrency:
  group: crm-sync
  cancel-in-progress: false

jobs:
  # Sonda do diagnóstico F78: mede em SEGUNDOS o segredo tal como ESTE
  # workflow o recebe (job separado, log disponível de imediato).
  sonda:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Sonda do segredo
        run: |
          python3 - << 'FIM'
          import os
          k = (os.environ.get("SUPABASE_SERVICE_KEY") or "").strip()
          fmt = "eyJ" if k.startswith("eyJ") else ("sb_" if k.startswith("sb_") else "outro")
          print(f"sonda: chave com {len(k)} caracteres, formato {fmt}")
          FIM

  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica segredos do Supabase
        id: seg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos SUPABASE_URL/SUPABASE_SERVICE_KEY ausentes — sincronização pulada (ver crm/fase2/COMO-INSTALAR.md, passo 7)."
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cria graph_tokens.json a partir do secret
        if: steps.seg.outputs.tem == 'true'
        env:
          GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
        run: |
          if [ -z "$GRAPH_REFRESH_TOKEN" ]; then
            echo "::error::O segredo GRAPH_REFRESH_TOKEN está vazio — sem ele não há como ler o To Do."
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("graph_tokens.json").write_text(
              json.dumps({"refresh_token": os.environ["GRAPH_REFRESH_TOKEN"]}))
          PY

      # Os segredos do Supabase entram aqui para o graph_refresh.py guardar o
      # refresh_token novo na tabela graph_token (crm/fase2/schema_graph_token.sql).
      # Sem isso, o crachá vence de tempos em tempos e a sincronização para.
      - name: Renova token Microsoft Graph
        if: steps.seg.outputs.tem == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python graph_refresh.py

      # ESCRITA DESLIGADA. Enquanto o To Do e o CRM convivem, o caminho seguro
      # é de mão única: To Do -> CRM. Um andamento replicado por engano vira
      # texto no corpo de uma tarefa, e desfazer isso é edição manual, uma a
      # uma. O script tem a mesma trava por dentro (ESCREVER_TODO=1), então
      # nem rodando à mão ele escreve sem ser mandado.
      #
      # Para religar: Settings > Secrets and variables > Actions > Variables,
      # criar ESCREVER_TODO com o valor 1.
      - name: Banco -> To Do (DESLIGADO por padrão)
        if: steps.seg.outputs.tem == 'true' && vars.ESCREVER_TODO == '1'
        env:
          ESCREVER_TODO: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/fase2/escrever_todo.py

      - name: To Do -> espelho (crawl completo das listas)
        if: steps.seg.outputs.tem == 'true'
        run: python crm/sync_todo.py

      - name: Espelho -> banco (idempotente)
        if: steps.seg.outputs.tem == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # senha padrão do escritório (item "Padrão" no checklist do To Do) —
          # opcional; sem ela os itens "Padrão" são só ignorados
          SENHA_PADRAO_MEUINSS: ${{ secrets.SENHA_PADRAO_MEUINSS }}
        run: python crm/fase2/migrar.py

      # F189 · o rito de cada caso pelos dados (casos.conducao). Falha aqui não
      # pode derrubar a sincronização: o próximo ciclo tenta de novo.
      - name: Rito pelos dados (condução estratégica)
        if: steps.seg.outputs.tem == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/conducao.py

      # E4 · auditoria To Do × CRM (a rodada das 06h50 e o botão do CRM):
      # compara a leitura desta rodada com o banco e grava as diferenças em
      # todo_auditoria. O repositório é público, então o log só tem números;
      # nomes e datas ficam no banco, que só a equipe lê.
      - name: Auditoria To Do × CRM
        if: steps.seg.outputs.tem == 'true' && inputs.auditar == 'sim'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crm/auditoria_todo.py
      # crm/data/crm.json contém dados sensíveis: fica só no runner efêmero —
      # NUNCA subir como artefato nem commitar.
